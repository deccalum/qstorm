services:
  db:
    image: postgres:16-alpine
    container_name: qstorm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qstorm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qstorm}
      POSTGRES_DB: ${POSTGRES_DB:-qstorm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qstorm_pgdata:/var/lib/postgresql/data
      - ${qstorm_BACKUP_DIR:-./data/db_backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qstorm} -d ${POSTGRES_DB:-qstorm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qstorm_pgdata:
    name: qstorm_pgdata
